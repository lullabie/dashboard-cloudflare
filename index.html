<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <header class="app-header">
        <h1>Dashboard</h1>
        <nav>
            <button class="nav-btn active" data-view="today">Today</button>
            <button class="nav-btn" data-view="goals">Goals</button>
            <button class="nav-btn" data-view="settings">Settings</button>
        </nav>
    </header>

    <main id="app-content">
        <!-- Views will be dynamically swapped here -->
        <section id="view-today" class="view active">
            <h2>Countdowns</h2>
            <div id="countdowns-container" class="grid-container"></div>
            
            <h2>Deadline Radar</h2>
            <div id="radar-container" class="grid-container"></div>
            
            <h2>Indicators</h2>
            <div id="indicators-container" class="grid-container"></div>
            
            <h2>Today's Priorities</h2>
            <div id="today-goals-container" class="grid-container">
                <div class="empty-state">No active goals for today. Enjoy your day!</div>
            </div>
        </section>

        <section id="view-goals" class="view hidden">
            <div class="view-header">
                <h2>Goals</h2>
                <button id="btn-create-goal" class="primary-btn">+ New Goal</button>
            </div>
            
            <div class="tabs">
                <button class="tab-btn active" data-tab="active-goals">Active</button>
                <button class="tab-btn" data-tab="archived-goals">Archive</button>
            </div>

            <div id="active-goals-container" class="grid-container tab-content active"></div>
            <div id="archived-goals-container" class="grid-container tab-content hidden"></div>
        </section>

        <section id="view-settings" class="view hidden">
            <h2>Data Management</h2>
            <div class="card">
                <h3>Durability Layer</h3>
                <p>Your data is stored securely in your browser. Export it regularly to prevent loss.</p>
                <div class="button-group">
                    <button id="btn-export" class="primary-btn">Export Data</button>
                    <label for="import-file" class="secondary-btn cursor-pointer">
                        Import Data
                        <input type="file" id="import-file" accept=".json" class="hidden-input">
                    </label>
                </div>
            </div>
        </section>
    </main>

    <!-- Modals -->
    <div id="goal-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-title">Create Goal</h2>
            <form id="goal-form">
                <input type="hidden" id="goal-id">
                <div class="form-group">
                    <label for="goal-title">Title</label>
                    <input type="text" id="goal-title" required>
                </div>
                <div class="form-group">
                    <label for="goal-notes">Notes</label>
                    <textarea id="goal-notes" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="goal-target">Target Check-ins (Number)</label>
                    <input type="number" id="goal-target" min="1" value="1">
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="goal-show-notes">
                    <label for="goal-show-notes">Show notes on card</label>
                </div>
                <div class="modal-actions">
                    <button type="button" class="secondary-btn" id="btn-cancel-modal">Cancel</button>
                    <button type="submit" class="primary-btn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
